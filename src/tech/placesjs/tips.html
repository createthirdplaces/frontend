<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8" />
    <style>
        body {
					background-image:none;
				}
				h2 {
            margin-top:1rem;
        }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reference</title>
    <script type="module">
 
      import {BaseCodeDisplayComponent} from
      "/js/content/framework/codeGuides/shared/BaseCodeDisplayComponent.js";

      import {AttributePassingExample} from
      "/tech/placesjs/guides/guidelines/AttributePassingExample.js";
      import {ImageHoverComponentGuide} from
      "/tech/placesjs/guides/guidelines/ImageHoverComponentGuide.js";
     import {VanillaJsClickResizeExample} from
      "/tech/placesjs/guides/guidelines/VanillaJsClickResizeExample.js";
                  
      class GuidelinesComponent extends HTMLElement {
        connectedCallback(){
          this.innerHTML = `
        <h3>Think carefully about your use case and how Places.js will help</h3>        
          <p>
          Using Places.js 
          over vanilla JavaScript for instances such as creating a basic show/hide component or an 
          image hover component. If you are unsure about using Places.js, try experimenting it on a new project or a 
          small part of an existing project.
          </p>
          <p>
           For websites that use Places.js, often it will make sense to create pages using standard web components, only
          use a JavaScript event handler,  or not use any JavaScript. Places.js
          is designed to be used on specific parts of a webpage that
          are interactive or require backend data fetching.
          </p>
          <p>
          One should make sure to minimize the amount of complexity. Sometimes,
          this means using creating pages without JavaScript or implementing an
          offline solution. For example, Places.js could be used for a coin
          flipping application that pick the start player for a 2 player board
          game. However, a physical coin could be used instead.

          </p>

          <p>
          Places.js components are web components, and vanilla JS web components
          can be added inside them. These components can have attributes passed
          to them.
                    
          <details>
            <summary><b>Example of passing data using attributes</b></summary>
             <attribute-passing-example></attribute-passing-example>
             
             An attribute can then be retrieved by calling the getAttribute method.
             <base-code-display-component>export class ImageUploadComponent extends HTMLElement {

  constructor() {
    super();
  
    const filePath = this.getAttribute("image-path");
    if (
      filePath === null ||
      filePath === undefined ||
      filePath === "null" ||
      filePath === "undefined" ||
      filePath.length === 0
    ) {
      this.setAttribute("image-path", "");
    }
    this.addEventListener("change", this.uploadImage);
    this.addEventListener("click", this.deleteImage);
  }      

  deleteImage(event) {
    const self = this;

    if (event.target.id === "remove-uploaded-image") {
      self.setAttribute("image-path", "");
      self.innerHTML = self.#getHtml();
      event.preventDefault();
    }
  }
  
  uploadImage(event) {
    const self = this;
    if (event.target.id === "upload-image-input") {
      let file = event.target.files[0];
      let reader = new FileReader();

      reader.readAsDataURL(file);
      reader.onload = function () {
        if (reader.result !== null) {
          self.setAttribute("image-path", reader.result.toString());
          self.innerHTML = self.#getHtml();
        }
      };
    }
  }
}</base-code-display-component>
          </details>
         
                  
<h3>Consider using vanilla JS web components, HTML, or CSS for simple interactivity needs</h3> 

          <p>There are many cases where vanilla JS, HTML, and CSS should be used
          for simple interactivity needs. For example, the CSS <a
          href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Selectors/:has">:has()
          CSS pseudo-class</a> can be used to conditionally add styling based
          on UI state without JavaScript. <a href="https://gomakethings.com/creating-a-toggle-switch-with-just-css/">Here </a> is an example
          of how a toggle switch can be created using only HTML and CSS.          
</p>

          <h4>Other examples of interactivity using vanilla JS and HTML</h4>
        
          <details>
            <summary><b> HTML show/hide functionality</b></summary>
            <base-code-display-component>
<details>
  <summary>Click to show details</summary>
  Details are here
</details></base-code-display-component>
            </details>
            <details>
              <summary><b>Vanilla JS  web component that resizes an image when hovering</b></summary>
              <image-hover-component-guide></image-hover-component-guide>
            </details>
                 
            <details>
              <summary><b>Image resizing example with a vanilla JS event handler</b></summary>
              <vanilla-js-click-resize-example></vanilla-js-click-resize-example>
          </details>

          <p>
    On the other hand, a component that is responsible for querying a backend API to update a user's event
            RSVP status, show the status of the RSVP API call, and show an updated RSVP count is a good candidate
            for a Places.js component.
          </li>
          </br>
          <h3>Create your website a multi page application(MPA) instead of a single page application(SPA)</h3> 
          <p>Places.js is
          designed around support for an MPA.           Second, it is very important for software projects to limit complexity in order to maximize long term 
          maintainability, speed up development, and minimize the risk of bugs.
          An MPA isolates complexity to a specific part of a website, which makes it easier to test and reason about
          the effects of a change, while helping to reduce the complexity of change.</p>
     

          <h3>Maintain a simple component hierarchy and minimize nested components</h3> 
          <p>As a general guideline, avoid having more
          than 3 layers of nested places.js components. This will make it easier to understand and maintain code while
          making sure the UI isn't complex. A simple UI will help users quickly accomplish a task.</p>
      
          <h3>If shadow DOM is used, make sure related elements are inside the
          same shadow root </h3>
          
          <p>Separating HTML elements that should be related such as label and
          associated input will cause accessibility 
              challenges. See the following link for more information.<a
              href="https://alice.pages.igalia.com/blog/how-shadow-dom-and-accessibility-are-in-conflict/">
              How Shadow DOM and accessibility are in conflict.</a>
          </p>    
        </ol>
    ` 
        }
      }

      customElements.define('base-code-display-component',BaseCodeDisplayComponent); 
      customElements.define('attribute-passing-example',AttributePassingExample);
      customElements.define('image-hover-component-guide',ImageHoverComponentGuide);
      customElements.define('vanilla-js-click-resize-example',VanillaJsClickResizeExample);
      customElements.define('guidelines-component',GuidelinesComponent);
    </script>
  </head>
  <body>

    {{>navbar}}
		{{>places-js-navbar}}
    <div id="container" class="container-xl section-div">
      <h2>Tips for using Places.js</h2>
      <guidelines-component></guidelines-component>

    </div>
    <div id="bot-container"></div>
    {{>footer}}

  </body>
</html>
